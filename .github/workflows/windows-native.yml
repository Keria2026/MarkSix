name: Windows Native
on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build and test Windows executable
        working-directory: backend
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package native binaries and MySQL
        run: ./scripts/package_windows_native.ps1 -Destination 'windows native package'
      - name: Test real Windows install, persistence and backup
        shell: powershell
        run: ./scripts/test_windows_native.ps1 -PackageDirectory 'windows native package'
      - uses: actions/upload-artifact@v4
        id: package
        with:
          name: MarkSix-Windows-Native-x64
          path: windows native package/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
      - name: Download instructions
        env:
          PACKAGE_URL: ${{ steps.package.outputs.artifact-url }}
        run: |
          "Windows native x64 (no Docker): [Download ZIP]($env:PACKAGE_URL). Extract all files and run Install.cmd." >> $env:GITHUB_STEP_SUMMARY
