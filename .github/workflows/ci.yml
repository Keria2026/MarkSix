name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-root
          MYSQL_DATABASE: marksix_test
          MYSQL_USER: marksix
          MYSQL_PASSWORD: disposable-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://marksix:disposable-ci-password@127.0.0.1:3306/marksix_test
      TEST_ADMIN_PASSWORD: disposable-browser-password
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Rust checks and database transactions
        working-directory: backend
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --test workflow -- --ignored
          cargo build --locked --example e2e_server
          cargo run --release --locked --example risk_bench
      - name: Frontend checks
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun x prettier --check 'src/**/*.{svelte,ts,css}' 'tests/*.ts' '*.ts'
          bun run check
          bun run build
          bun x playwright install --with-deps chromium
      - name: Browser workflow and accessibility
        run: |
          backend/target/debug/examples/e2e_server > /tmp/marksix-e2e.log 2>&1 &
          cd frontend
          API_TARGET=http://127.0.0.1:8081 bun run dev --port 5174 > /tmp/marksix-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/api/health && curl -fsS http://127.0.0.1:5174/ >/dev/null; then break; fi
            sleep 1
          done
          bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: frontend/playwright-report
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: names
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ steps.names.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ steps.names.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Compose health smoke test
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
          DB_PASSWORD: disposable-image-db
          DB_ROOT_PASSWORD: disposable-image-root
          ADMIN_PASSWORD: disposable-image-admin
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8088/api/health
          curl -fsS http://127.0.0.1:8088/ >/dev/null
      - name: Export tested images
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: docker save "$BACKEND_IMAGE" "$FRONTEND_IMAGE" | gzip > marksix-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: marksix-images
          path: marksix-images.tar.gz
          retention-days: 7
      - name: Publish tested images
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          printf 'Backend: `%s`\nFrontend: `%s`\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
