name: CI
on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-root
          MYSQL_DATABASE: marksix_test
          MYSQL_USER: marksix
          MYSQL_PASSWORD: disposable-ci-password
          MYSQL_ROOT_HOST: "%"
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://marksix:disposable-ci-password@127.0.0.1:3306/marksix_test
      TEST_ADMIN_PASSWORD: disposable-browser-password
      TEST_PROVISION_DATABASE_URL: mysql://root:disposable-ci-root@127.0.0.1:3306/marksix_test
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Ubuntu lifecycle failure paths and Python 3.10 package verification
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Locked Rust dependency security gate
        run: python3 scripts/audit_dependencies.py
      - name: Rust checks and database transactions
        working-directory: backend
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --test upgrade -- --ignored
          cargo test --locked --test workflow -- --ignored
          cargo test --locked --test receipts -- --ignored
          cargo test --locked --lib hosted::tests -- --ignored
          cargo test --locked --lib worker::recovery_tests -- --ignored
          cargo build --locked --example e2e_server
          cargo run --release --locked --example risk_bench
      - name: Customer rules runtime accounting acceptance
        run: |
          cargo build --locked --manifest-path backend/Cargo.toml --example runtime_server
          python3 scripts/runtime_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance
          path: |
            test-results/runtime-acceptance.json
            test-results/slip-export.json
          retention-days: 7
      - name: Frontend checks
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun x prettier --check 'src/**/*.{svelte,ts,css}' 'tests/*.ts' '*.ts'
          bun x prettier --check '../README.md' '../docs/**/*.md'
          python3 ../scripts/check_docs.py
          bun audit
          bun run check
          bun x playwright test --list
          bun run build
          bun x playwright install --with-deps chromium
      - name: Browser workflow and accessibility
        run: |
          backend/target/debug/examples/e2e_server > /tmp/marksix-e2e.log 2>&1 &
          cd frontend
          API_TARGET=http://127.0.0.1:8081 bun run dev --port 5174 > /tmp/marksix-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/api/health && curl -fsS http://127.0.0.1:5174/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/api/site
          curl -fsS http://127.0.0.1:5174/ >/dev/null
          bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: frontend/playwright-report
          retention-days: 7
  images:
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: names
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: MARKSIX_REVISION=${{ github.sha }}
          load: true
          tags: ${{ steps.names.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ steps.names.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare hosted browser acceptance
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun x playwright install --with-deps chromium
      - name: Load MySQL runtime for isolated hosted acceptance
        run: docker pull mysql:8.4
      - name: Hosted Nginx TLS, accounts and lifecycle acceptance
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: sudo python3 scripts/hosted_acceptance.py --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE" --browser --bun "$(command -v bun)" --browser-cache "$HOME/.cache/ms-playwright"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-acceptance
          path: test-results/hosted-acceptance.json
          retention-days: 7
          if-no-files-found: error
      - name: Package the tested hosted Ubuntu images
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: |
          python3 scripts/package_ubuntu.py --output ubuntu-package --version "$GITHUB_SHA" --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE"
          python3 ubuntu-package/verify.py
          bash -n ubuntu-package/hosted/*.sh
      - uses: actions/upload-artifact@v4
        id: ubuntu-package
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        with:
          name: MarkSix-Ubuntu-x64
          path: ubuntu-package/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Ubuntu download link
        if: steps.ubuntu-package.outcome == 'success'
        env:
          PACKAGE_URL: ${{ steps.ubuntu-package.outputs.artifact-url }}
        run: |
          printf 'Ubuntu x64 deployment: [Download ZIP](%s). Follow hosted/README.md for Ubuntu hosted deployment.\n' "$PACKAGE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish tested images
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          printf 'Backend: `%s`\nFrontend: `%s`\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    name: Deploy MarkSix to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, images]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: marksix-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject superseded master builds inside the production queue
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
            const allowed = data.commit.sha === context.sha;
            core.setOutput('allowed', String(allowed));
            if (!allowed) core.notice('Skipping superseded master artifact; production was not changed.');
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.allowed == 'true'
        with:
          name: MarkSix-Ubuntu-x64
          path: tested-release
      - name: Transfer and deploy the tested artifact
        if: steps.gate.outputs.allowed == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$VPS_KNOWN_HOSTS" && -n "$VPS_SSH_KEY" ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/marksix"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/marksix" "$HOME/.ssh/known_hosts"
          cleanup() {
            result=$?
            trap - EXIT
            if [[ -n "${stage:-}" ]]; then
              ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "python3 - discard $receive_args" < deploy/vps/receive.py || true
            fi
            rm -f "$HOME/.ssh/marksix"
            exit "$result"
          }
          trap cleanup EXIT
          ssh_options=(-i "$HOME/.ssh/marksix" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          tar -cf tested-release.tar -C tested-release .
          archive_bytes=$(stat -c '%s' tested-release.tar)
          package_bytes=$(python3 -c 'import tarfile; print(sum(m.size for m in tarfile.open("tested-release.tar")))')
          image_bytes=$(python3 -c 'import json; print(json.load(open("tested-release/manifest.json"))["image_unpacked_bytes"])')
          for bytes in "$archive_bytes" "$package_bytes" "$image_bytes" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"; do [[ "$bytes" =~ ^[1-9][0-9]*$ ]]; done
          receive_args="$GITHUB_SHA $GITHUB_RUN_NUMBER $GITHUB_RUN_ATTEMPT $archive_bytes $package_bytes $image_bytes"
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "python3 - prepare $receive_args" < deploy/vps/receive.py
          stage="/opt/marksix/releases/.incoming-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          scp "${ssh_options[@]}" -P "$VPS_PORT" tested-release.tar "$VPS_USER@$VPS_HOST:$stage/package.tar"
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "python3 - extract $receive_args" < deploy/vps/receive.py
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "sudo -n systemd-run --unit=marksix-deploy-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT --collect --wait --pipe /bin/bash /opt/marksix/releases/$GITHUB_SHA/hosted/release.sh $GITHUB_SHA $VPS_USER $GITHUB_RUN_NUMBER $GITHUB_RUN_ATTEMPT"
      - name: Verify public domain routing
        if: steps.gate.outputs.allowed == 'true'
        env:
          PUBLIC_APP_URL: ${{ vars.APP_URL || 'https://3801.win' }}
          PUBLIC_ADMIN_URL: ${{ vars.ADMIN_URL || 'https://admin.3801.win' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 "${PUBLIC_APP_URL%/}/api/site" | python3 -c 'import json,os,sys; data=json.load(sys.stdin); assert data["mode"]=="hosted" and data["commit"]==os.environ["GITHUB_SHA"]'
          curl --fail --silent --show-error --retry 3 --max-time 20 "${PUBLIC_ADMIN_URL%/}/api/site" | python3 -c 'import json,os,sys; data=json.load(sys.stdin); assert data["mode"]=="authority" and data["commit"]==os.environ["GITHUB_SHA"]'
          printf 'MarkSix production commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
