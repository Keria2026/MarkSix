name: CI
on:
  push:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
jobs:
  frontend:
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frontend checks
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun x prettier --check 'src/**/*.{svelte,ts,css}' 'tests/**/*.ts' '*.ts'
          bun x prettier --check '../README.md' '../docs/**/*.md'
          bun run check
          bun run check:tests
          bun test --coverage --coverage-reporter=lcov --coverage-dir=../test-results/coverage/frontend tests/contracts
          bun ../scripts/generate_text_entry.ts ../test-results/text-entry-corpus
          bun ../scripts/train_text_entry.ts ../test-results/text-entry-corpus/train.jsonl
          git diff --exit-code -- src/lib/generated/text-entry-candidates.json
          bun ../scripts/evaluate_text_entry.ts ../test-results/text-entry-corpus/train.jsonl ../test-results/text-entry-corpus/train-report.json
          bun ../scripts/evaluate_text_entry.ts ../test-results/text-entry-corpus/validation.jsonl ../test-results/text-entry-corpus/validation-report.json
          bun ../scripts/evaluate_text_entry.ts ../test-results/text-entry-corpus/test.jsonl ../test-results/text-entry-corpus/test-report.json
          bun ../scripts/generate_text_entry_boundaries.ts ../test-results/text-entry-boundaries
          bun ../scripts/evaluate_text_entry_boundaries.ts ../test-results/text-entry-boundaries
          bun ../scripts/check_text_entry_campaign.ts --size 3600 --output ../test-results/text-entry-campaign
          bun ../scripts/check_text_entry_campaign.ts --seed 52061 --size 360 --output ../test-results/text-entry-vectors --vectors ../test-results/text-entry-vectors/vectors.json
          cmp ../backend/tests/fixtures/text-entry-vectors.json ../test-results/text-entry-vectors/vectors.json
          python3 ../scripts/tests/run_mutation_campaign.py
          bun x playwright test --list
          bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-input-frontend
          path: test-results/coverage/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-entry-corpus
          path: |
            test-results/text-entry-corpus/
            test-results/text-entry-boundaries/
            test-results/text-entry-campaign/
            test-results/text-entry-vectors/
            test-results/rebuild/mutations/
          retention-days: 7
          if-no-files-found: error
  integration:
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    # Playwright 1.58.2 supports Ubuntu 24.04; ubuntu-latest may select 26.04.
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-root
          MYSQL_DATABASE: marksix_test
          MYSQL_USER: marksix
          MYSQL_PASSWORD: disposable-ci-password
          MYSQL_ROOT_HOST: "%"
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://marksix:disposable-ci-password@127.0.0.1:3306/marksix_test
      TEST_ADMIN_PASSWORD: disposable-browser-password
      TEST_PROVISION_DATABASE_URL: mysql://root:disposable-ci-root@127.0.0.1:3306/marksix_test
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Ubuntu lifecycle failure paths and Python 3.10 package verification
        run: |
          python3 -m pip install -r scripts/requirements-test.txt
          python3 -m coverage run -m unittest discover -s scripts/tests -v
          python3 -m coverage json
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: verify
      - name: Install Rust coverage tooling
        run: cargo install cargo-llvm-cov --locked --version 0.6.21
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locked Rust dependency security gate
        run: python3 -m coverage run --append scripts/audit_dependencies.py
      - name: Rust checks and database transactions
        working-directory: backend
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --no-report
          cargo llvm-cov --locked --no-report -- --ignored --test-threads=1
          cargo llvm-cov report --json --output-path ../test-results/coverage/backend.json
      - name: Browser dependencies and Python entry checks
        run: |
          (cd frontend && bun install --frozen-lockfile)
          python3 -m coverage run --append scripts/check_docs.py
          python3 -m coverage run --append scripts/audit_dependencies.py --frontend
          (cd frontend && bun x playwright install --with-deps --only-shell chromium)
      - name: Browser workflow and accessibility
        run: bash scripts/test_browser.sh
      - name: Export Python coverage
        if: always()
        run: python3 -m coverage json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-input-integration
          path: test-results/coverage/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: frontend/playwright-report
          retention-days: 7
  verify:
    if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/master')
    needs: [frontend, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-input-*
          merge-multiple: true
          path: test-results/coverage/
      - name: Coverage inventory
        if: always()
        run: python3 scripts/coverage_report.py --minimum 90 --scope backend --scope frontend --scope python
      - name: Require every validation job
        if: always()
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$INTEGRATION_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: test-results/coverage/
          retention-days: 7
          if-no-files-found: error
  images:
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: names
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: MARKSIX_REVISION=${{ github.sha }}
          load: true
          tags: ${{ steps.names.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ steps.names.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Load MySQL runtime for isolated hosted acceptance
        run: docker pull mysql:8.4
      - name: Hosted Nginx TLS, accounts and lifecycle acceptance
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: sudo env "PATH=$PATH" python3 scripts/verify_hosted.py --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-acceptance
          path: test-results/hosted-acceptance.json
          retention-days: 7
          if-no-files-found: error
      - name: Package the tested hosted Ubuntu images
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: |
          python3 scripts/package_ubuntu.py --output ubuntu-package --version "$GITHUB_SHA" --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE"
          python3 ubuntu-package/verify.py
          bash -n ubuntu-package/hosted/*.sh
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch'
        with:
          name: image-package-input
          path: ubuntu-package/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch'
    needs: [verify, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-package-input
          path: ubuntu-package
      - name: Verify the release package
        run: python3 ubuntu-package/verify.py
      - uses: actions/upload-artifact@v4
        id: ubuntu-package
        with:
          name: ${{ github.event_name == 'push' && 'marksix-verified-dev' || 'MarkSix-Ubuntu-x64' }}
          path: ubuntu-package/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Ubuntu download link
        if: steps.ubuntu-package.outcome == 'success'
        env:
          PACKAGE_URL: ${{ steps.ubuntu-package.outputs.artifact-url }}
        run: |
          printf 'Ubuntu x64 deployment: [Download ZIP](%s). Follow hosted/README.md for Ubuntu hosted deployment.\n' "$PACKAGE_URL" >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [verify, images, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MarkSix-Ubuntu-x64
          path: tested-release
      - name: Verify and load the tested images
        run: |
          python3 tested-release/verify.py
          docker load -i tested-release/images.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          backend="ghcr.io/${repository}-backend:${GITHUB_SHA}"
          frontend="ghcr.io/${repository}-frontend:${GITHUB_SHA}"
          docker tag "marksix-backend:${GITHUB_SHA}" "$backend"
          docker tag "marksix-frontend:${GITHUB_SHA}" "$frontend"
          docker push "$backend"
          docker push "$frontend"
          printf 'Backend: `%s`\nFrontend: `%s`\n' "$backend" "$frontend" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    name: Deploy MarkSix to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: marksix-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Find a validated matching dev artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select_dev_artifact.py >> "$GITHUB_OUTPUT"
      - name: Reject superseded master builds inside the production queue
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
            const allowed = data.commit.sha === context.sha;
            core.setOutput('allowed', String(allowed));
            if (!allowed) core.notice('Skipping superseded master artifact; production was not changed.');
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.allowed == 'true'
        with:
          name: marksix-verified-dev
          path: tested-release
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Verify downloaded tested package
        if: steps.gate.outputs.allowed == 'true'
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 tested-release/verify.py
          python3 -c 'import json, os; assert json.load(open("tested-release/manifest.json"))["version"] == os.environ["TESTED_SHA"]'
      - name: Transfer and deploy the tested artifact
        if: steps.gate.outputs.allowed == 'true'
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
          PUBLIC_ADMIN_URL: ${{ vars.ADMIN_URL }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$VPS_KNOWN_HOSTS" && -n "$VPS_SSH_KEY" ]]
          [[ "$PUBLIC_APP_URL" == https://* && "$PUBLIC_ADMIN_URL" == https://* ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/marksix"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/marksix" "$HOME/.ssh/known_hosts"
          cleanup() {
            result=$?
            trap - EXIT
            if [[ -n "${stage:-}" ]]; then
              ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "python3 - discard $receive_args" < deploy/vps/receive.py || true
            fi
            rm -f "$HOME/.ssh/marksix"
            exit "$result"
          }
          trap cleanup EXIT
          ssh_options=(-i "$HOME/.ssh/marksix" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          tar -cf tested-release.tar -C tested-release .
          archive_bytes=$(stat -c '%s' tested-release.tar)
          package_bytes=$(python3 -c 'import tarfile; print(sum(m.size for m in tarfile.open("tested-release.tar")))')
          image_bytes=$(python3 -c 'import json; print(json.load(open("tested-release/manifest.json"))["image_unpacked_bytes"])')
          for bytes in "$archive_bytes" "$package_bytes" "$image_bytes" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"; do [[ "$bytes" =~ ^[1-9][0-9]*$ ]]; done
          receive_args="$TESTED_SHA $GITHUB_RUN_NUMBER $GITHUB_RUN_ATTEMPT $archive_bytes $package_bytes $image_bytes"
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "python3 - prepare $receive_args" < deploy/vps/receive.py
          stage="/opt/marksix/releases/.incoming-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT-$TESTED_SHA"
          scp "${ssh_options[@]}" -P "$VPS_PORT" tested-release.tar "$VPS_USER@$VPS_HOST:$stage/package.tar"
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "python3 - extract $receive_args" < deploy/vps/receive.py
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "sudo -n systemd-run --unit=marksix-deploy-$TESTED_SHA-$GITHUB_RUN_ATTEMPT --collect --wait --pipe /bin/bash /opt/marksix/releases/$TESTED_SHA/hosted/release.sh $TESTED_SHA $VPS_USER $GITHUB_RUN_NUMBER $GITHUB_RUN_ATTEMPT"
      - name: Verify public domain routing
        if: steps.gate.outputs.allowed == 'true'
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
          PUBLIC_ADMIN_URL: ${{ vars.ADMIN_URL }}
        run: |
          set -euo pipefail
          [[ "$PUBLIC_APP_URL" == https://* && "$PUBLIC_ADMIN_URL" == https://* ]]
          curl --fail --silent --show-error --retry 3 --max-time 20 "${PUBLIC_APP_URL%/}/api/site" | python3 -c 'import json,os,sys; data=json.load(sys.stdin); assert data["mode"]=="hosted" and data["commit"]==os.environ["TESTED_SHA"]'
          curl --fail --silent --show-error --retry 3 --max-time 20 "${PUBLIC_ADMIN_URL%/}/api/site" | python3 -c 'import json,os,sys; data=json.load(sys.stdin); assert data["mode"]=="authority" and data["commit"]==os.environ["TESTED_SHA"]'
          printf 'MarkSix production commit: `%s`\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
