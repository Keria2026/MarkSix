name: marksix
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: marksix
      MYSQL_USER: marksix
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/configure.py first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/configure.py first}
    command:
      - --innodb-buffer-pool-size=96M
      - --max-connections=20
      - --performance-schema=OFF
      - --temptable-max-ram=32M
      - --temptable-max-mmap=0
      - --mysqlx=0
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u marksix marksix -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s
  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-marksix-backend:local}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://marksix:${DB_PASSWORD}@db:3306/marksix
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/configure.py first}
      BIND_ADDR: 0.0.0.0:8080
      SECURE_COOKIE: "false"
    mem_limit: 384m
    cpus: 1.4
    stop_grace_period: 20s
  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-marksix-frontend:local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8088}:80"
    mem_limit: 64m
    cpus: 0.1
volumes:
  mysql-data:
