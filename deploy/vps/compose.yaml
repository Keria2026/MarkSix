name: marksix-hosted
x-logging: &bounded-logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: ${MYSQL_IMAGE:?Set release images}
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      MYSQL_DATABASE: marksix_control
      MYSQL_USER: authority
      MYSQL_PASSWORD: ${AUTHORITY_DB_PASSWORD:?Configure shared .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure shared .env}
      MYSQL_ROOT_HOST: "%"
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?Configure shared .env}
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    command: [--innodb-buffer-pool-size=96M, --max-connections=64, --performance-schema=OFF, --table-open-cache=128, --table-definition-cache=400, --thread-cache-size=8, --temptable-max-ram=16M, --temptable-max-mmap=0, --mysqlx=0, --skip-log-bin, --log-error-verbosity=1, --general-log=OFF, --slow-query-log=OFF]
    volumes:
      - hosted-data:/var/lib/mysql
      - ./init-portal.sh:/docker-entrypoint-initdb.d/20-portal.sh:ro
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u authority marksix_control -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
    stop_grace_period: 45s
  authority:
    logging: *bounded-logs
    image: ${BACKEND_IMAGE:?Set release images}
    command: [marksix, --hosted-authority]
    restart: unless-stopped
    init: true
    depends_on:
      db: {condition: service_healthy}
    environment:
      CONTROL_DATABASE_URL: mysql://authority:${AUTHORITY_DB_PASSWORD}@db:3306/marksix_control
      PROVISION_DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD}@db:3306/marksix_control
      AUTHORITY_ADMIN_USERNAME: ${AUTHORITY_ADMIN_USERNAME:?Configure shared .env}
      AUTHORITY_ADMIN_PASSWORD: ${AUTHORITY_ADMIN_PASSWORD:?Configure shared .env}
      BIND_ADDR: 0.0.0.0:8090
      SECURE_COOKIE: "true"
      TENANT_DB_HOST: db
      BACKUP_ROOT: /backups
      CONFIGURE_PORTAL_GRANTS: "true"
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    volumes:
      - ${HOSTED_SHARED_ROOT:?Configure shared .env}/backups:/backups
    mem_limit: 128m
    cpus: 0.2
    healthcheck:
      test: [CMD, marksix, --hosted-healthcheck]
      interval: 10s
      timeout: 4s
      start_period: 45s
      retries: 10
    stop_grace_period: 45s
  backend:
    logging: *bounded-logs
    image: ${BACKEND_IMAGE:?Set release images}
    command: [marksix, --hosted]
    restart: unless-stopped
    init: true
    depends_on:
      authority: {condition: service_healthy}
    environment:
      CONTROL_DATABASE_URL: mysql://portal:${PORTAL_DB_PASSWORD}@db:3306/marksix_control
      BIND_ADDR: 0.0.0.0:8080
      SECURE_COOKIE: "true"
      TENANT_DB_HOST: db
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    mem_limit: 256m
    cpus: 1.2
    healthcheck:
      test: [CMD, marksix, --hosted-healthcheck]
      interval: 10s
      timeout: 4s
      start_period: 30s
      retries: 10
    stop_grace_period: 45s
  nginx:
    logging: *bounded-logs
    image: ${FRONTEND_IMAGE:?Set release images}
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      authority: {condition: service_healthy}
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configure shared .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Configure shared .env}
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./bootstrap.conf:/etc/nginx/bootstrap.conf:ro
      - ./customer.inc:/etc/nginx/conf.d/customer.inc:ro
      - ./authority.inc:/etc/nginx/conf.d/authority.inc:ro
      - ${HOSTED_SHARED_ROOT}/letsencrypt:/etc/letsencrypt:ro
      - ${HOSTED_SHARED_ROOT}/acme:/var/www/acme:ro
    mem_limit: 32m
    cpus: 0.1
    healthcheck:
      test: [CMD-SHELL, 'wget -Y off -q -O /dev/null --header="Host: $$APP_DOMAIN" http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
  tools:
    image: ${MYSQL_IMAGE:?Set release images}
    profiles: [maintenance]
    entrypoint: ["sleep", "infinity"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure shared .env}
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    mem_limit: 64m
    cpus: 0.2
    logging: *bounded-logs
volumes:
  hosted-data:
